name: Bug report
description: Report a reproducible BasaltVR problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach credentials, device identifiers, proprietary game files, or private screen content.
        Security vulnerabilities should be reported privately as described in SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Management app
        - Streamer / ALVR transport
        - OpenXR runtime
        - Wine bottle tooling
        - Packaging / setup
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Mac model, macOS version, headset, ALVR version, and USB or Wi-Fi.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
      description: >-
        In the management app, Help › Diagnostic Report… builds a redacted report you can review
        and paste here.
    validations:
      required: true
