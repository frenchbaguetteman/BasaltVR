name: Developer preview release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.1.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Apple Silicon preview
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: zsh {0}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            print -u2 "Invalid release version: $version"
            exit 2
          fi
          print "version=$version" >> "$GITHUB_OUTPUT"
          print "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f "docs/releases/v${VERSION}.md"
          grep -Fq "## ${VERSION} " CHANGELOG.md

      - name: Install release prerequisites
        run: brew install cmake mingw-w64 meson ninja

      - name: Build and verify Basalt DXMT fork
        run: |
          runtime/scripts/build-dxmt-fork.zsh
          runtime/scripts/test-dxmt.zsh

      - name: Run contributor quality gate
        run: make check

      - name: Build release archive
        run: packaging/build-release.zsh "${{ steps.version.outputs.version }}"

      - name: Publish prerelease and assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: zsh {0}
        run: |
          notes="docs/releases/${TAG}.md"
          [[ -f "$notes" ]] || {
            print -u2 "Missing release notes: $notes"
            exit 1
          }
          assets=(
            "release/BasaltVR-${VERSION}-macos-arm64.zip"
            "release/BasaltVR-${VERSION}-macos-arm64.zip.sha256"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            print -u2 "Release ${TAG} already exists; published assets are immutable."
            print -u2 "Create a new version instead of replacing release history."
            exit 1
          fi
          gh release create "$TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "BasaltVR ${VERSION} developer preview" \
            --notes-file "$notes" \
            --prerelease
