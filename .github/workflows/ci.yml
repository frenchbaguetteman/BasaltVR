name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository and Swift quality
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run contributor quality gate
        run: make check

  runtime:
    name: OpenXR cross-build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross-build prerequisites
        run: brew install cmake mingw-w64
      - name: Verify cross-build environment
        run: make doctor-runtime
      - name: Configure runtime
        run: |
          cmake -S runtime -B runtime/build-ci \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/runtime/cmake/toolchains/mingw-x86_64.cmake" \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build runtime and smoke executables
        run: cmake --build runtime/build-ci --parallel
